<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike · mind-elixir</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #1d2129; background: #f7f7f8; display: grid; grid-template-rows: auto 1fr 38%; height: 100vh; }
      header { padding: 8px 12px; border-bottom: 1px solid #d5d8de; background: #fff; }
      header b { font-size: 14px; }
      #map { position: relative; min-height: 0; }
      #bottom { display: grid; grid-template-columns: 1fr 320px; min-height: 0; border-top: 1px solid #d5d8de; }
      #sheet { overflow: auto; background: #fff; padding: 8px; }
      #log { overflow: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border-left: 1px solid #d5d8de; white-space: pre-wrap; }
      table.grid { border-collapse: collapse; table-layout: fixed; font: 12px/1.3 Arial, sans-serif; }
      table.grid td, table.grid th { border: 1px solid #b7bcc4; padding: 2px 5px; vertical-align: top; text-align: left; }
      table.grid th { background: #eef0f3; }
      table.grid .k-title { font-weight: 700; border: 0; }
      table.grid .k-meta { font-style: italic; color: #626a78; border: 0; }
    </style>
  </head>
  <body>
    <header><b>Spike: mind-elixir as the map</b> · Tab = child, Enter = sibling, double-click = edit. Its edits are read back into our model after every change, and the Sheet preview below is rebuilt from that.</header>
    <div id="map"></div>
    <div id="bottom"><div id="sheet"></div><div id="log"></div></div>
    <script type="module" src="./spike-mind-elixir.ts"></script>
  </body>
</html>
